name: Release Toonflow
run-name: Release Toonflow ${{ inputs.version || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 发布版本号（X.Y.Z，例如 0.0.1）
        type: string
        required: true
        default: "0.0.1"
      title:
        description: Release 标题，留空使用版本号
        type: string
      ref:
        description: 留空使用当前选择的分支或标签
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: toonflow-release
  cancel-in-progress: false

jobs:
  build:
    name: 构建 Windows 安装包
    uses: ./.github/workflows/debug.yml
    with:
      target: windowsX64
      ref: ${{ inputs.ref || github.sha }}
      version: ${{ inputs.version || github.ref_name }}
      generatePatch: false

  release:
    name: 发布 GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 校验已有版本标签
        env:
          GH_TOKEN: ${{ github.token }}
          releaseVersion: ${{ needs.build.outputs.version }}
          buildCommit: ${{ needs.build.outputs.commit }}
        run: |
          node --input-type=module <<'JS'
          const tag = `refs/tags/v${process.env.releaseVersion}`;
          const api = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}`;
          const headers = { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: "application/vnd.github+json" };
          let response = await fetch(`${api}/git/ref/tags/v${process.env.releaseVersion}`, {
            headers,
            signal: AbortSignal.timeout(30000),
          });
          if (response.status !== 404) {
            if (!response.ok) throw new Error(`读取版本标签失败（HTTP ${response.status}）`);
            let { object } = await response.json();
            while (object.type === "tag") {
              response = await fetch(`${api}/git/tags/${object.sha}`, { headers, signal: AbortSignal.timeout(30000) });
              if (!response.ok) throw new Error(`解析版本标签失败（HTTP ${response.status}）`);
              ({ object } = await response.json());
            }
            if (object.type !== "commit" || object.sha !== process.env.buildCommit) throw new Error(`${tag} 与构建提交不一致，请使用新版本号或选择该标签对应的代码。`);
          }
          JS
      - name: 下载 Windows 产物
        uses: actions/download-artifact@v8
        with:
          name: toonflow-${{ needs.build.outputs.version }}-windowsX64
          path: artifacts
      - name: 生成下载说明
        env:
          releaseVersion: ${{ needs.build.outputs.version }}
        run: |
          node --input-type=module <<'JS'
          import { readdirSync, statSync, writeFileSync } from "node:fs";
          import { join } from "node:path";

          const version = process.env.releaseVersion;
          const installer = `toonflow-${version}-Setup.exe`;
          const files = readdirSync("artifacts");
          if (!files.includes(installer) || !statSync(join("artifacts", installer)).size) {
            throw new Error(`缺少有效的 Windows 安装包：${installer}`);
          }
          const baseUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/releases/download/v${version}`;
          writeFileSync("releaseBody.md", [
            `## Windows 安装包`,
            "",
            `[下载 Windows 64 位安装包](${baseUrl}/${encodeURIComponent(installer)})`,
            "",
            "下载后双击安装包，按提示完成安装。",
            "",
            "包含导演之眼、Toonflow 导演与视频制作、剧本创作工作室内置插件。",
            "",
            "其他附件为完整更新包和更新清单。",
            "",
          ].join("\n"));
          JS
      - name: 发布安装包及更新文件
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ needs.build.outputs.commit }}
          name: ${{ inputs.title || format('Toonflow {0}', needs.build.outputs.version) }}
          make_latest: true
          body_path: releaseBody.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
